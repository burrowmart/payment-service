apiVersion: v2
name: payment-service
description: >
  Payment-service Helm chart. Participates in the order-placement saga (charge/refund).
  Declares base-service as a chart dependency so all Kubernetes object templates
  (Deployment, Service, Ingress, ExternalSecret, HPA, PDB, ServiceAccount, ConfigMap)
  are inherited without duplication. Only service-specific values live here.
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - archtenet
  - microservice
  - payment-service
maintainers:
  - name: platform-team
dependencies:
  - name: base-service
    version: "0.1.0"
    repository: "file://../../platform-infra/helm/base-service"
